[project]
name = "mlx-plastic-rank"
version = "0.1.1"
description = "MLX low-rank layers and static adapter packs"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Gheorghe Iuga" },
]
requires-python = ">=3.13"
dependencies = [
    "mlx>=0.20.0",
    "numpy",
    "safetensors",
]

classifiers = [
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
data = ["datasets"]
# Extras for compression utilities and HF downloading
compress = [
    "huggingface_hub>=0.23",
    "tqdm>=4",
]
packs = [
    "mlx-lm",
    "mlx-vlm",
    "mlx-audio",
]

[tool.pytest.ini_options]
testpaths = ["tests/core", "tests/packs", "tests/tools"]
addopts = "-q"
pythonpath = [".", "tests/packs"]

[project.scripts]
packs = "mlx_plastic_rank.packs.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
