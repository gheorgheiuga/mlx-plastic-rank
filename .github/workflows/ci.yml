name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      research:
        description: Also run the parked research regression suite
        type: boolean
        default: false

jobs:
  test:
    name: tests (macos-14 / py3.13)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Install package
        run: uv sync --locked
      - name: Run ruff
        run: |
          uv run --locked ruff check
      - name: Run mypy
        run: |
          uv run --locked mypy
      - name: Run core, pack and utility tests
        run: |
          uv run --locked pytest -q
      - name: Run parked research tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.research }}
        run: uv run --locked pytest -q tests/research
